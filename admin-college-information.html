<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Information | AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0b111a;
            color: #f3f5fa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1, h2 {
            color: #f5bd50;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            margin-top: 12px;
            background: #f5bd50;
            color: #0b111a;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            background: #2a3a50;
            color: white;
        }

        .delete-btn {
            background: #c0392b;
            color: white;
            margin-left: 8px;
        }

        .info-card, .empty {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .category {
            color: #f5bd50;
        }

        .description {
            color: #a9b6ca;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .search-box {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 13px;
            border: 1px solid #2a3a50;
            border-radius: 6px;
            background: #0b111a;
            color: white;
            font-size: 15px;
        }

        .search-input:focus {
            outline: 1px solid #f5bd50;
        }

        .clear-btn {
            background: #2a3a50;
            color: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .search-form {
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <div>
            <h1>College Information</h1>
            <p>View and manage stored college information.</p>
        </div>

        <div>
            <a th:href="@{/admin/college-information/add}"
               class="btn">
                + Add Information
            </a>

            <a th:href="@{/admin-dashboard}"
               class="btn back-btn">
                Dashboard
            </a>
        </div>

    </div>

    <!-- Search Section -->
    <div class="search-box">

        <h2>Search Information</h2>

        <form th:action="@{/admin/college-information}"
              method="get"
              class="search-form">

            <input type="text"
                   name="keyword"
                   class="search-input"
                   placeholder="Search by information title..."
                   th:value="${searchKeyword}">

            <button type="submit" class="btn">
                Search
            </button>

            <a th:href="@{/admin/college-information}"
               class="btn clear-btn">
                Clear Search
            </a>

        </form>

    </div>

    <!-- Empty Database -->
    <div th:if="${#lists.isEmpty(informationList)}"
         class="empty">

        <p th:if="${searchKeyword != null and !#strings.isEmpty(searchKeyword)}">
            No information found for:
            <strong th:text="${searchKeyword}"></strong>
        </p>

        <p th:unless="${searchKeyword != null and !#strings.isEmpty(searchKeyword)}">
            No college information has been added yet.
        </p>

    </div>

    <!-- Information Cards -->
    <div th:each="info : ${informationList}"
         class="info-card">

        <h2 th:text="${info.title}">
            Information Title
        </h2>

        <p class="category">
            Category:
            <span th:text="${info.category}">General</span>
        </p>

        <p class="description"
           th:text="${info.description}">
            Information description
        </p>

        <a th:href="@{/admin/college-information/edit/{id}(id=${info.id})}"
           class="btn">
            Edit Information
        </a>

        <form th:action="@{/admin/college-information/delete/{id}(id=${info.id})}"
              method="post"
              style="display:inline;"
              onsubmit="return confirm('Are you sure you want to delete this information?');">

            <button type="submit" class="btn delete-btn">
                Delete Information
            </button>

        </form>

    </div>

</div>

</body>
</html>
