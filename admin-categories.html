<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #0b111a;
            color: #f3f5fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        h1, h2 {
            color: #f5bd50;
        }

        .panel {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        input {
            background: #0b111a;
            color: white;
            border: 1px solid #2a3a50;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            margin: 8px 0;
        }

        button, .back-link {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #f5bd50;
            color: #0b111a;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .back-link:hover {
            background: #ffd477;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }

        .delete-btn:hover {
            background: #b83c38;
        }

        .rename-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .rename-form input {
            margin: 0;
            min-width: 120px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #2a3a50;
            text-align: left;
        }

        th {
            color: #f5bd50;
        }

        .message {
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #173d2d;
            color: #8cf0b5;
        }

        .error {
            background: #4b2222;
            color: #ffaaaa;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .rename-form {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Category Management</h1>

        <a th:href="@{/admin-dashboard}" class="back-link">
            ← Back to Dashboard
        </a>
    </div>

    <!-- Success Message -->
    <div th:if="${success}" class="message success"
         th:text="${success}">
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="message error"
         th:text="${error}">
    </div>

    <!-- Add Category -->
    <div class="panel">

        <h2>Add New Category</h2>

        <form th:action="@{/admin/categories/add}"
              method="post">

            <label for="categoryName">Category Name</label>

            <input type="text"
                   id="categoryName"
                   name="name"
                   placeholder="Enter category name"
                   maxlength="100"
                   required>

            <button type="submit">+ Add Category</button>

        </form>

    </div>

    <!-- Existing Categories -->
    <div class="panel">

        <h2>Existing Categories</h2>

        <p>
            Total Categories:
            <strong th:text="${#lists.size(categories)}">0</strong>
        </p>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>S.No</th>
                    <th>Category Name</th>
                    <th>Rename Category</th>
                    <th>Delete</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="category, status : ${categories}">

                    <td th:text="${status.count}">1</td>

                    <td th:text="${category.name}">
                        Facilities
                    </td>

                    <!-- Rename -->
                    <td>

                        <form class="rename-form"
                              th:action="@{/admin/categories/rename/{id}(id=${category.id})}"
                              method="post">

                            <input type="text"
                                   name="name"
                                   th:value="${category.name}"
                                   maxlength="100"
                                   required>

                            <button type="submit">
                                Rename
                            </button>

                        </form>

                    </td>

                    <!-- Delete -->
                    <td>

                        <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this category?');">

                            <button type="submit"
                                    class="delete-btn">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4">
                        No categories available. Add your first category above.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
