<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0b111a;
            color: #f3f5fa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: #f5bd50;
        }

        h2 {
            color: #f3f5fa;
        }

        .back {
            color: #f5bd50;
            text-decoration: none;
        }

        .panel {
            background: #131e2c;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a3a50;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border: 1px solid #2a3a50;
            border-radius: 6px;
            background: #0b111a;
            color: white;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-btn {
            background: #f5bd50;
            color: #0b111a;
        }

        .clear-btn {
            color: white;
            background: #34445a;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 6px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #2a3a50;
        }

        th {
            color: #f5bd50;
        }

        .action-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 6px;
            margin: 3px;
        }

        .view-btn {
            background: #16875b;
        }

        .edit-btn {
            background: #2878bd;
        }

        .delete-btn {
            background: #c0392b;
            color: white;
            padding: 9px 12px;
            margin: 3px;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success {
            background: #173d2b;
            color: #8ee5ae;
        }

        .error {
            background: #482323;
            color: #ffaaaa;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #a9b6ca;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>Student Management</h1>

        <a class="back" th:href="@{/admin-dashboard}">
            ← Back to Dashboard
        </a>
    </div>

    <div class="panel">

        <div th:if="${successMessage}"
             class="message success"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}">
        </div>

        <h2>Registered Students</h2>

        <!-- Search Form -->
        <form class="search-form"
              th:action="@{/admin/students}"
              method="get">

            <input type="text"
                   name="keyword"
                   placeholder="Search by name or email"
                   th:value="${searchKeyword}">

            <button type="submit" class="search-btn">
                Search
            </button>

            <a th:href="@{/admin/students}" class="clear-btn">
                Clear
            </a>
        </form>

        <!-- Students Table -->
        <div class="table-wrapper">

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="student : ${students}">

                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.phone}"></td>

                    <td>

                        <!-- View Student -->
                        <a class="action-btn view-btn"
                           th:href="@{/admin/students/view/{id}(id=${student.id})}">
                            View
                        </a>

                        <!-- Edit Student -->
                        <a class="action-btn edit-btn"
                           th:href="@{/admin/students/edit/{id}(id=${student.id})}">
                            Edit
                        </a>

                        <!-- Delete Student -->
                        <form style="display:inline"
                              th:action="@{/admin/students/delete/{id}(id=${student.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">

                            <button type="submit" class="delete-btn">
                                Delete
                            </button>

                        </form>

                    </td>
                </tr>

                <!-- Empty Result -->
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="5" class="empty">
                        No students found.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>

    </div>
</div>
</body>
</html>
