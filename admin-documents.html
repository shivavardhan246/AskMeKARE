<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents & Images | AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0b111a;
            color: #f3f5fa;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
        }

        h1, h2 {
            color: #f5bd50;
        }

        .card {
            background: #131e2c;
            padding: 25px;
            border: 1px solid #2a3a50;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            margin: 18px 0;
            padding: 12px;
            border: 1px solid #2a3a50;
            border-radius: 6px;
            background: #0b111a;
            color: #f3f5fa;
        }

        button, .btn {
            display: inline-block;
            padding: 11px 17px;
            border: none;
            border-radius: 6px;
            background: #f5bd50;
            color: #0b111a;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .delete-btn {
            background: #c94b4b;
            color: white;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success {
            background: #174c35;
            color: #b7f5d0;
        }

        .error {
            background: #5b2525;
            color: #ffd0d0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #2a3a50;
            text-align: left;
        }

        th {
            color: #f5bd50;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty {
            color: #a9b6ca;
            text-align: center;
            padding: 25px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            color: #f5bd50;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Documents & Images</h1>
    <p>Upload and manage college documents and images.</p>

    <div th:if="${success}" class="message success"
         th:text="${success}"></div>

    <div th:if="${error}" class="message error"
         th:text="${error}"></div>

    <div class="card">

        <h2>Upload New File</h2>

        <p>Allowed formats: PDF, JPG, JPEG and PNG.</p>
        <p>Maximum file size: 10 MB.</p>

        <form th:action="@{/admin/documents/upload}"
              method="post"
              enctype="multipart/form-data">

            <input type="file"
                   name="file"
                   accept=".pdf,.jpg,.jpeg,.png"
                   required>

            <button type="submit">Upload File</button>

        </form>

    </div>

    <div class="card">

        <h2>Uploaded Files</h2>

        <div class="table-wrapper">

            <table>
                <thead>
                <tr>
                    <th>File Name</th>
                    <th>File Type</th>
                    <th>Uploaded At</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="document : ${documents}">

                    <td th:text="${document.originalFileName}"></td>

                    <td th:text="${document.fileType}"></td>

                    <td th:text="${#temporals.format(document.uploadedAt, 'dd-MM-yyyy HH:mm')}"></td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/admin/documents/download/{id}(id=${document.id})}"
                               class="btn">
                                Download
                            </a>

                            <form th:action="@{/admin/documents/delete/{id}(id=${document.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this file?');">

                                <button type="submit" class="delete-btn">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(documents)}">
                    <td colspan="4" class="empty">
                        No documents or images uploaded yet.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>

    </div>

    <a th:href="@{/admin-dashboard}" class="back-btn">
        ← Back to Admin Dashboard
    </a>

</div>

</body>
</html>
