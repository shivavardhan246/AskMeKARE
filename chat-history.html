<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMeKARE - Chat History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #0b111a;
            color: #f3f5fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 14px;
        }

        h1 {
            color: #f5bd50;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .user {
            background: #203650;
        }

        .bot {
            background: #192638;
            border: 1px solid #2a3a50;
        }

        .empty {
            color: #a9b6ca;
            padding: 20px 0;
        }

        a, button {
            display: inline-block;
            margin: 10px 8px 0 0;
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            background: #f5bd50;
            color: #0b111a;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .clear {
            background: #8d3942;
            color: white;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Recent Questions</h1>
    <p>Your recent chatbot conversation in this session.</p>

    <div th:if="${chatHistory == null or #lists.isEmpty(chatHistory)}"
         class="empty">
        No chat history available yet. Ask a question in the chatbot first.
    </div>

    <div th:each="message : ${chatHistory}"
         th:class="${message['sender'] == 'You'} ? 'message user' : 'message bot'">

        <strong th:text="${message['sender']}">Sender</strong>
        <p th:text="${message['message']}">Message</p>
    </div>

    <a th:href="@{/chatbot}">Back to Chatbot</a>
    <a th:href="@{/dashboard}">Dashboard</a>

    <form th:action="@{/chatbot/clear}" method="post"
          style="display:inline;">
        <button type="submit" class="clear">Clear Chat History</button>
    </form>
</div>
</body>
</html>
