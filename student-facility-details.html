<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facility Details | AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0b111a;
            color: #f3f5fa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1, h2 {
            color: #f5bd50;
        }

        .facility-info {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .facility-info p {
            color: #a9b6ca;
            line-height: 1.7;
        }

        .photo-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            overflow: hidden;
        }

        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo-name {
            padding: 12px;
            color: #a9b6ca;
            overflow-wrap: anywhere;
        }

        .empty-message {
            color: #a9b6ca;
            background: #131e2c;
            padding: 20px;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            padding: 11px 17px;
            background: #f5bd50;
            color: #0b111a;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="facility-info">

        <h1 th:text="${facility.name}">
            Facility Name
        </h1>

        <p>
            <strong>Category:</strong>
            <span th:text="${facility.category ?: 'Not specified'}"></span>
        </p>

        <p>
            <strong>Location:</strong>
            <span th:text="${facility.location ?: 'Not specified'}"></span>
        </p>

        <h2>About This Facility</h2>

        <p th:text="${facility.description}">
            Facility description
        </p>

    </div>

    <h2>Facility Photos</h2>

    <div th:if="${#lists.isEmpty(photos)}"
         class="empty-message">

        No photos are available for this facility yet.

    </div>

    <div class="photo-grid">

        <div class="photo-card"
             th:each="photo : ${photos}">

            <img th:src="@{/student/facilities/photos/{id}(id=${photo.id})}"
                 th:alt="${photo.originalFileName}">

            <div class="photo-name"
                 th:text="${photo.originalFileName}">
                Photo name
            </div>

        </div>

    </div>

    <a th:href="@{/student/facilities}" class="btn">
        Back to All Facilities
    </a>

</div>

</body>
</html>
