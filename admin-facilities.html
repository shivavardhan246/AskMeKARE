<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Facilities | AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #0b111a;
            color: #f3f5fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #f5bd50;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .facility-card {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .facility-card h2 {
            color: #f5bd50;
            margin-top: 0;
        }

        .muted {
            color: #a9b6ca;
        }

        .success {
            color: #7ee0a0;
        }

        .error {
            color: #ff8585;
        }

        .btn {
            display: inline-block;
            padding: 11px 17px;
            background: #f5bd50;
            color: #0b111a;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn {
            background: #a93232;
            color: white;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .actions form {
            margin: 0;
        }

        .empty-message {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            padding: 25px;
            color: #a9b6ca;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <div>
            <h1>College Facilities</h1>
            <p class="muted">
                Manage college facilities, information and photos.
            </p>
        </div>

        <a th:href="@{/admin/facilities/add}" class="btn">
            + Add Facility
        </a>
    </div>

    <p class="success"
       th:if="${success}"
       th:text="${success}">
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <div th:if="${#lists.isEmpty(facilities)}"
         class="empty-message">

        <h3>No Facilities Added Yet</h3>
        <p>Add your first college facility using the button above.</p>

    </div>

    <div th:each="facility : ${facilities}"
         class="facility-card">

        <h2 th:text="${facility.name}">
            Facility Name
        </h2>

        <p>
            <strong>Category:</strong>
            <span th:text="${facility.category ?: 'Not specified'}">
            </span>
        </p>

        <p>
            <strong>Location:</strong>
            <span th:text="${facility.location ?: 'Not specified'}">
            </span>
        </p>

        <p th:text="${facility.description}">
            Facility description
        </p>

        <div class="actions">

            <!-- Manage Photos -->
            <a th:href="@{/admin/facilities/{id}/photos(id=${facility.id})}"
               class="btn">
                Manage Photos
            </a>

            <!-- Edit Facility -->
            <a th:href="@{/admin/facilities/edit/{id}(id=${facility.id})}"
               class="btn">
                Edit
            </a>

            <!-- Delete Facility -->
            <form th:action="@{/admin/facilities/delete/{id}(id=${facility.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this facility?');">

                <button type="submit" class="btn delete-btn">
                    Delete
                </button>

            </form>

        </div>

    </div>

    <br>

    <a th:href="@{/admin-dashboard}" class="btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>
