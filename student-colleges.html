<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Information - AskMeKARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #0b111a;
            color: #f3f5fa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: #f5bd50;
            margin: 0;
        }

        .back-link {
            color: #f5bd50;
            text-decoration: none;
            border: 1px solid #f5bd50;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-form input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #2a3a50;
            border-radius: 6px;
            background: #131e2c;
            color: #f3f5fa;
        }

        button {
            padding: 12px 20px;
            background: #f5bd50;
            color: #0b111a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
        }

        .card {
            background: #131e2c;
            border: 1px solid #2a3a50;
            border-radius: 10px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .card-content {
            padding: 18px;
        }

        .category {
            display: inline-block;
            color: #f5bd50;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .card h2 {
            margin: 5px 0 12px;
            font-size: 20px;
        }

        .description {
            color: #a9b6ca;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty {
            color: #a9b6ca;
            text-align: center;
            padding: 35px;
            background: #131e2c;
            border-radius: 8px;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .search-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>College Information</h1>
        <a class="back-link" href="/dashboard">Back to Dashboard</a>
    </div>

    <form class="search-form" action="/colleges" method="get">
        <input type="text"
               name="keyword"
               placeholder="Search college information..."
               th:value="${searchKeyword}">
        <button type="submit">Search</button>
    </form>

    <div class="cards" th:if="${not #lists.isEmpty(informationList)}">

        <div class="card" th:each="info : ${informationList}">

            <img th:if="${info.imagePath != null and !#strings.isEmpty(info.imagePath)}"
                 th:src="@{${info.imagePath}}"
                 alt="College information image">

            <div class="card-content">

                <span class="category"
                      th:text="${info.category}">
                    Category
                </span>

                <h2 th:text="${info.title}">
                    Information Title
                </h2>

                <p class="description"
                   th:text="${info.description}">
                    Information description
                </p>

            </div>
        </div>
    </div>

    <div class="empty"
         th:if="${#lists.isEmpty(informationList)}">
        No college information found.
    </div>

</div>
</body>
</html>
